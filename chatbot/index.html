<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorings Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <div class="logo-badge" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="23" stroke="white" stroke-width="2" />
          <path d="M24 14L38 20L24 26L10 20L24 14Z" fill="white" />
          <path d="M17 23V30C17 30 20 33 24 33C28 33 31 30 31 30V23" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <div>
        <h1>Tutorings Assistant</h1>
        <p>Ask me anything about ILETS</p>
      </div>
    </header>

    <main id="chat-window" class="chat-window">
      <!-- messages get added here by app.js -->
    </main>

    <form id="chat-form" class="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="Type your question..."
        autocomplete="off"
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Load order matters: data -> config -> gemini logic -> app glue -->
  <script src="data.js"></script>
  <script src="config.js"></script>
  <script src="gemini.js"></script>
  <script src="app.js"></script>
</body>
</html>
