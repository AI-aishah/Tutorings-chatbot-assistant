<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorings IELTS Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <div class="logo-badge" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="23" stroke="white" stroke-width="2" />
          <path d="M24 14L38 20L24 26L10 20L24 14Z" fill="white" />
          <path d="M17 23V30C17 30 20 33 24 33C28 33 31 30 31 30V23" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <div>
        <h1>Tutorings IELTS Assistant</h1>
        <p>Clear answers about the IELTS test</p>
      </div>
    </header>

    <main id="chat-window" class="chat-window" aria-live="polite">
      <!-- messages get added here by app.js -->
    </main>

    <section class="suggested-questions" aria-label="Suggested questions">
      <p>Try asking:</p>
      <div class="question-chips">
        <button type="button" data-question="What are the IELTS test sections?">Test sections</button>
        <button type="button" data-question="What is the difference between Academic and General Training?">Test formats</button>
        <button type="button" data-question="How are IELTS band scores calculated?">Band scores</button>
      </div>
    </section>

    <form id="chat-form" class="chat-form">
      <label class="sr-only" for="chat-input">Ask an IELTS question</label>
      <input
        id="chat-input"
        type="text"
        placeholder="Ask an IELTS question..."
        autocomplete="off"
        maxlength="300"
      />
      <button type="submit" disabled>Send</button>
    </form>
  </div>

  <!-- Load order matters: data -> safe config -> chat logic -> app glue -->
  <script src="data.js"></script>
  <script src="config.js"></script>
  <script src="assistant.js"></script>
  <script src="app.js"></script>
</body>
</html>
